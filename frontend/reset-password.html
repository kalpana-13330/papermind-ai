<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PaperMind AI</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Global, Auth & Responsive Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <main class="auth-content" style="flex: 1; min-height: 100vh; background: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 100%);">
            <div class="auth-card card-glass text-center animate-fade-in">
                <div class="auth-header">
                    <div class="logo-icon" style="width: 50px; height: 50px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; border-radius: 12px; margin: 0 auto 1.5rem auto;">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2 class="auth-title" style="color: var(--text-white);">Set New Password</h2>
                    <p class="auth-subtitle" style="color: #94a3b8; max-width: 320px; margin: 0 auto;">Enter and confirm your new password below.</p>
                </div>

                <form class="auth-form" id="resetPasswordForm">
                    <div class="form-group" style="text-align: left; margin-bottom: 1.25rem;">
                        <label for="newPassword" class="form-label" style="color: var(--text-white);">New Password</label>
                        <div class="input-container">
                            <span class="input-icon-left"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="newPassword" class="auth-input" style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); color: var(--text-white);" placeholder="At least 6 characters" required minlength="6">
                        </div>
                    </div>

                    <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                        <label for="confirmNewPassword" class="form-label" style="color: var(--text-white);">Confirm Password</label>
                        <div class="input-container">
                            <span class="input-icon-left"><i class="fa-solid fa-check"></i></span>
                            <input type="password" id="confirmNewPassword" class="auth-input" style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); color: var(--text-white);" placeholder="Re-enter new password" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-btn ripple-effect" id="submitResetBtn">
                        <span>Update Password</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-footer" style="margin-top: 2rem;">
                    <a href="login.html" class="auth-footer-link" style="color: #a5b4fc; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" style="position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem;"></div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showToast('Reset token missing. Please use the link sent to your email.', false);
            }

            const form = document.getElementById('resetPasswordForm');
            const newPassword = document.getElementById('newPassword');
            const confirmNewPassword = document.getElementById('confirmNewPassword');
            const submitBtn = document.getElementById('submitResetBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!token) {
                    showToast('Invalid or missing reset token.', false);
                    return;
                }

                if (newPassword.value.length < 6) {
                    showToast('Password must be at least 6 characters long.', false);
                    return;
                }

                if (newPassword.value !== confirmNewPassword.value) {
                    showToast('Passwords do not match.', false);
                    return;
                }

                const origHtml = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Updating...</span>';

                try {
                    const res = await window.authAPI.resetPassword(token, newPassword.value);
                    showToast(res.message || 'Password successfully updated!', true);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = origHtml;
                    showToast(err.message || 'Failed to reset password.', false);
                }
            });
        });

        function showToast(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'card-glass';
            toast.style.padding = '1rem 1.5rem';
            toast.style.borderRadius = '12px';
            toast.style.color = '#fff';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '0.75rem';
            toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
            toast.style.border = '1px solid rgba(255,255,255,0.1)';
            toast.style.background = 'rgba(15, 23, 42, 0.9)';
            toast.style.transform = 'translateY(20px)';
            toast.style.opacity = '0';
            toast.style.transition = 'all 0.3s ease';
            
            const icon = isSuccess ? '<i class="fa-solid fa-circle-check text-success"></i>' : '<i class="fa-solid fa-circle-exclamation text-warning" style="color: #f59e0b;"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                toast.style.transform = 'translateY(-20px)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
