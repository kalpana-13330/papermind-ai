<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PaperMind AI</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Global, Auth & Responsive Stylesheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="auth-wrapper">
        <!-- Center centered container for simple forgot password placeholder -->
        <main class="auth-content" style="flex: 1; min-height: 100vh; background: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 100%);">
            <div class="auth-card card-glass text-center animate-fade-in">
                <div class="auth-header">
                    <div class="logo-icon" style="width: 50px; height: 50px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; border-radius: 12px; margin: 0 auto 1.5rem auto;">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h2 class="auth-title" style="color: var(--text-white);">Reset Password</h2>
                    <p class="auth-subtitle" style="color: #94a3b8; max-width: 320px; margin: 0 auto;">Enter your email to receive password reset instructions.</p>
                </div>

                <form class="auth-form" style="margin-top: 2rem;">
                    <div class="form-group-floating">
                        <input type="email" id="resetEmail" class="floating-input" placeholder=" " required>
                        <label for="resetEmail" class="floating-label">Email Address</label>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="width: 100%; margin-top: 1.5rem;">
                        <i class="fa-solid fa-paper-plane"></i> <span>Send Reset Link</span>
                    </button>

                    <div style="margin-top: 1.5rem; font-size: 0.88rem;">
                        <a href="login.html" style="color: #818cf8; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="toastContainer" style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999;"></div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                window.location.href = `reset-password.html?token=${encodeURIComponent(token)}`;
                return;
            }

            const form = document.querySelector('.auth-form');
            const emailInput = document.getElementById('resetEmail');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = emailInput.value.trim();
                    if (!email) return;

                    const submitBtn = form.querySelector('button[type="submit"]');
                    const origHtml = submitBtn.innerHTML;
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Sending...</span>';

                    try {
                        const res = await window.authAPI.forgotPassword(email);
                        showToast(res.message || 'Reset instructions sent to your email!');
                        form.reset();
                    } catch (err) {
                        showToast(err.message || 'Failed to send reset email.', false);
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = origHtml;
                    }
                });
            }
        });

        function showToast(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'card-glass';
            toast.style.padding = '1rem 1.5rem';
            toast.style.borderRadius = '12px';
            toast.style.color = '#fff';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '0.75rem';
            toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
            toast.style.border = '1px solid rgba(255,255,255,0.1)';
            toast.style.background = 'rgba(15, 23, 42, 0.9)';
            toast.style.transform = 'translateY(20px)';
            toast.style.opacity = '0';
            toast.style.transition = 'all 0.3s ease';
            
            const icon = isSuccess ? '<i class="fa-solid fa-circle-check text-success"></i>' : '<i class="fa-solid fa-circle-exclamation text-warning" style="color: #f59e0b;"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                toast.style.transform = 'translateY(-20px)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
